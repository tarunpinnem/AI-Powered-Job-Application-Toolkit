<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.05);
        }
        input[type="file"] {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: white;
        }
        button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }
        .success {
            border-left: 4px solid #4ECDC4;
        }
        .error {
            border-left: 4px solid #FF6B6B;
        }
        .preview {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 File Upload Test</h1>
        <p>This page helps debug PDF/DOCX file uploads and text extraction.</p>
        
        <div class="upload-area">
            <h3>📁 Upload Your Resume</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" id="fileInput" name="resume_file" accept=".pdf,.docx,.txt" required>
                <br><br>
                <button type="submit">🚀 Test Upload</button>
            </form>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showResult('Please select a file', 'error');
                return;
            }
            
            formData.append('resume_file', file);
            
            try {
                showResult('⏳ Processing file...', 'info');
                
                const response = await fetch('/api/test-upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    let html = `
                        <h3>✅ Upload Successful</h3>
                        <p><strong>Filename:</strong> ${result.filename}</p>
                        <p><strong>File Size:</strong> ${result.file_size} bytes</p>
                        <p><strong>Extracted Text Length:</strong> ${result.extracted_length} characters</p>
                        
                        <h4>📋 Debug Information:</h4>
                        <ul>
                            <li>PDF Plumber Available: ${result.debug_info.has_pdfplumber ? '✅' : '❌'}</li>
                            <li>PyPDF2 Available: ${result.debug_info.has_pypdf2 ? '✅' : '❌'}</li>
                            <li>DOCX Available: ${result.debug_info.has_docx ? '✅' : '❌'}</li>
                            <li>File Extension: ${result.debug_info.file_extension}</li>
                        </ul>
                    `;
                    
                    if (result.extraction_preview) {
                        html += `
                            <h4>📄 Text Preview (first 300 characters):</h4>
                            <div class="preview">${result.extraction_preview}</div>
                        `;
                    }
                    
                    showResult(html, 'success');
                } else {
                    let html = `
                        <h3>❌ Upload Failed</h3>
                        <p><strong>Error:</strong> ${result.error}</p>
                    `;
                    
                    if (result.debug_info) {
                        html += `
                            <h4>🐛 Debug Information:</h4>
                            <pre>${JSON.stringify(result.debug_info, null, 2)}</pre>
                        `;
                    }
                    
                    showResult(html, 'error');
                }
                
            } catch (error) {
                showResult(`Network error: ${error.message}`, 'error');
            }
        });
        
        function showResult(content, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result ${type}">${content}</div>`;
        }
    </script>
</body>
</html>
